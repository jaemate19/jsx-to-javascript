<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSX to JavaScript Converter</title>
    <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚛️ JSX → JavaScript</h1>
            <p>Convert React JSX to vanilla JavaScript instantly</p>
        </div>

        <div class="content">
            <!-- Main Input -->
            <div class="main-input">
                <textarea id="user-input" rows="8" placeholder="Paste your JSX code here...&#10;&#10;Example:&#10;&lt;div className=&quot;container&quot;&gt;&#10;    &lt;h1&gt;Hello World&lt;/h1&gt;&#10;&lt;/div&gt;"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button id="convert-button" class="btn btn-primary" disabled>
                    <span>🔄</span> Convert to JavaScript
                </button>
                <button id="clear-button" class="btn btn-secondary">
                    <span>🗑️</span> Clear
                </button>
                <button id="sample-button" class="btn btn-outline">
                    <span>📝</span> Load Sample
                </button>
            </div>

            <!-- Output Section -->
            <div class="output-section">
                <div class="output-header">
                    <h3>
                        <span>📦 JavaScript Output</span>
                        <span id="output-status"></span>
                    </h3>
                    <div id="char-count">0 characters</div>
                </div>
                <div id="response"></div>
                <button id="copy-button" class="btn btn-outline" >
                    <span>📋</span> Copy to Clipboard
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
